<div class="p-4 bg-white shadow-md rounded-xl flex justify-between items-center cursor-pointer hover:bg-gray-100 transition"
     (click)="onClick()">
  <div>
    <h3 class="text-lg font-semibold text-gray-800">{{ title() }}</h3>
    <p class="text-sm text-gray-500">Creado el: {{ createdAt() | date:'mediumDate' }}</p>
  </div>
  <span class="text-sm font-medium px-3 py-1 rounded-full" [ngClass]="statusClass">
    {{ statusLabel }}
  </span>
</div>

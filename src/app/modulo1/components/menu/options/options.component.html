<aside class="w-60 min-h-screen bg-[#165A96] text-white flex flex-col items-center py-6 space-y-8">
  <!-- Logo -->
  <img [src]="logoUrl" alt="Logo" class="h-20 w-auto" />

  <!-- Navegación -->
  <nav class="w-full px-4 space-y-2 text-sm font-medium">
    @for (item of menuOption; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-[#4879B6]"
        class="flex items-center gap-3 px-4 py-2 rounded-md hover:bg-[#4879B6] transition-colors"
      >
        <i class="{{ item.icon }} w-5 text-base text-white"></i>
        <span class="whitespace-nowrap">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>

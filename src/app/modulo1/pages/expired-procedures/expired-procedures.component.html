<section class="p-6">
    <h2 class="text-2xl font-bold text-blue-900 uppercase text-center mb-6">Trámites vencidos</h2>
  
    <div class="overflow-x-auto">
      <table class="min-w-full border border-gray-300 text-center">
        <thead class="bg-gray-200 text-red-600 font-bold">
          <tr>
            <th class="px-4 py-2 border">ID</th>
            <th class="px-4 py-2 border">Nombre</th>
            <th class="px-4 py-2 border">Apellido</th>
            <th class="px-4 py-2 border">Tipo</th>
            <th class="px-4 py-2 border">Imagen</th>
            <th class="px-4 py-2 border">Acción</th>
          </tr>
        </thead>
        <tbody>
          @for (tramite of procedures; track tramite.id) {
            <tr class="bg-gray-100 hover:bg-gray-200">
              <td class="px-4 py-2 border text-red-600 font-semibold">{{ tramite.id }}</td>
              <td class="px-4 py-2 border text-red-600">{{ tramite.nombre }}</td>
              <td class="px-4 py-2 border text-red-600">{{ tramite.apellido }}</td>
              <td class="px-4 py-2 border text-red-600">{{ tramite.tipo }}</td>
              <td class="px-4 py-2 border text-xl">
                <i class="fa-solid fa-eye text-black"></i>
              </td>
              <td class="px-4 py-2 border">
                <button
                  routerLink="/dashboard/expired-detail"
                  class="bg-purple-600 hover:bg-purple-700 text-white text-sm px-3 py-1 rounded-full uppercase"
                >
                  Verificar
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  
    <div class="fixed bottom-6 right-6">
      <a routerLink="/dashboard/process">
        <button class="flex items-center gap-2 bg-purple-700 hover:bg-purple-800 text-white px-4 py-2 rounded-full shadow-md">
          <i class="fa-solid fa-arrow-left"></i>
          Regresar
        </button>
      </a>
    </div>
  </section>

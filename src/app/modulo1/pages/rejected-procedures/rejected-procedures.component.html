<div class="p-6">
    <h2 class="text-2xl font-bold text-red-700 mb-6">Trámites Rechazados</h2>
  
    @if (procedures.length > 0) {
      <div class="grid gap-4">
        @for (procedure of procedures; track procedure.id) {
          <div class="bg-white p-4 rounded-xl shadow hover:shadow-md transition border-l-4 border-red-500">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="text-lg font-semibold text-gray-800">{{ procedure.title }}</h3>
                <p class="text-sm text-gray-600">Rechazado el {{ procedure.date }}</p>
                <p class="text-sm text-gray-500 italic mt-1">Motivo: {{ procedure.motivo }}</p>
              </div>         
                <button
                  routerLink="/dashboard/rejected-detail"
                  class="bg-purple-600 hover:bg-purple-700 text-white text-sm px-3 py-1 rounded-full uppercase"
                >
                  Verificar
                </button>       
            </div>
          </div>
        }
      </div>
    } @else {
      <p class="text-gray-500 text-sm italic">No hay trámites rechazados en este momento.</p>
    }
  </div>

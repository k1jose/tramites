<div class="p-6 max-w-3xl mx-auto bg-white shadow rounded-2xl">
    <h2 class="text-2xl font-bold text-red-700 mb-4 text-center">Detalle del Trámite Rechazado</h2>
  
    <div class="space-y-4">
      <div>
        <p class="text-sm text-gray-600">Título del trámite:</p>
        <p class="text-lg font-semibold text-gray-800">{{ title }}</p>
      </div>
  
      <div>
        <p class="text-sm text-gray-600">Motivo del rechazo:</p>
        <p class="text-base text-gray-700 italic">{{ motivo }}</p>
      </div>
  
      <div>
        <p class="text-sm text-gray-600">Observaciones:</p>
        <textarea
          [(ngModel)]="observacion"
          rows="4"
          class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-400"
          placeholder="Agrega una observación...">
        </textarea>
      </div>
    </div>
  
    
  <div class="flex justify-end mt-8">
    <button
  (click)="volver()"
  class="fixed bottom-4 right-4 bg-purple-700 hover:bg-purple-800 text-white px-4 py-2 rounded-full shadow flex items-center gap-2 text-sm"
>
  <i class="fa-solid fa-arrow-left"></i>
  Regresar
</button>

    
  </div>
  </div>

<section class="p-6">
    <h2 class="text-2xl font-bold text-yellow-600 uppercase mb-6 text-center">Trámite pendiente</h2>
  
    <div class="bg-white rounded-xl shadow-md p-6">
      <h3 class="text-center text-lg font-semibold mb-4">Verificación de trámite</h3>
  
      <div class="grid md:grid-cols-2 gap-6">
        <!-- Imagen del trámite -->
        <div class="flex justify-center items-center">
          <img src="assets/img/logo.png" alt="Documento del trámite" class="rounded-md shadow border">
        </div>
  
        <!-- Requisitos y Observación -->
        <div>
          <h4 class="font-semibold mb-2 text-gray-700">Requisitos cumplidos</h4>
          <ul class="space-y-2 text-sm text-gray-800">
            <li><input type="checkbox" checked disabled> Requisito 1</li>
            <li><input type="checkbox" checked disabled> Requisito 2</li>
            <li><input type="checkbox" checked disabled> Requisito 3</li>
            <li><input type="checkbox" checked disabled> Requisito 4</li>
            <li><input type="checkbox" checked disabled> Requisito 5</li>
          </ul>
  
          <div class="mt-4">
            <label class="block mb-1 font-semibold text-gray-700">Observación</label>
            <textarea class="w-full h-24 p-2 border rounded resize-none" placeholder="Observaciones..." disabled></textarea>
          </div>
        </div>
      </div>
  
      <!-- Botones de acción -->
      <div class="flex justify-center gap-4 mt-8">
        <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Guardar</button>
        <button class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">Denegado</button>
        <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Cancelar</button>
      </div>
    </div>
  
    <!-- Botón flotante Regresar -->
    <div class="fixed bottom-4 right-4">
      <button routerLink="/dashboard/process" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
        <span class="material-icons"></span> Regresar
      </button>
    </div>
  </section>

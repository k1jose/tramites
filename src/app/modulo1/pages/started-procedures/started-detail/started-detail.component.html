<div class="p-6 bg-gray-100 rounded-xl shadow-lg relative min-h-screen">
  <h2 class="text-xl font-semibold text-center mb-4 text-blue-800">Verificación de trámite</h2>

  <!-- Imagen del trámite -->
  <div class="flex justify-center mb-4">
    <img
      src="assets/img/logo.png"
      alt="Documento del trámite"
      class="border rounded shadow-md"
    />
  </div>

  <!-- Requisitos + Observación -->
  <div class="grid grid-cols-2 gap-6">
    <!-- Requisitos -->
    <div>
      <h3 class="font-bold mb-2">Requisitos cumplidos</h3>
      <ul class="space-y-1">
        @for (req of requisitos; track req) {
          <li class="flex items-center gap-2 text-sm text-gray-800">
            <i class="fa-solid fa-square-check text-blue-600"></i> {{ req }}
          </li>
        }
      </ul>
    </div>

    <!-- Observación -->
    <div>
      <h3 class="font-bold mb-2">Observación</h3>
      <textarea
        [(ngModel)]="observacion"
        rows="6"
        placeholder="Escribe una observación..."
        class="w-full border border-gray-300 rounded p-2 text-sm resize-none"
      ></textarea>
    </div>
  </div>

  <!-- Botones de acción -->
  <div class="flex justify-center gap-4 mt-6">
    <button
      (click)="guardar()"
      class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow text-sm"
    >
      Guardar
    </button>
    <button
      (click)="denegar()"
      class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded shadow text-sm"
    >
      Denegado
    </button>
    <button
      (click)="cancelar()"
      class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded shadow text-sm"
    >
      Cancelar
    </button>
  </div>

  <!-- Botón Regresar flotante -->
  <button
  type="button"
  (click)="goBack()"
  class="fixed bottom-4 right-4 bg-purple-700 hover:bg-purple-800 text-white px-4 py-2 rounded-full shadow flex items-center gap-2 text-sm"
>
  <i class="fa-solid fa-arrow-left"></i>
  Regresar
</button>


</div>

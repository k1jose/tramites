<section class="p-6 flex justify-center">
    <form [formGroup]="form" (ngSubmit)="guardar()" class="w-full max-w-md bg-gray-100 p-6 rounded-2xl shadow-lg space-y-4">
      <h2 class="text-xl font-bold text-center text-blue-900 uppercase">Agregar nuevo documento</h2>
  
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Nombre:</label>
        <input type="text" formControlName="nombre" class="w-full px-4 py-2 rounded-full border focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
  
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Apellido:</label>
        <input type="text" formControlName="apellido" class="w-full px-4 py-2 rounded-full border focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
  
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Fecha:</label>
        <input type="date" formControlName="fecha" class="w-full px-4 py-2 rounded-full border focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
  
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Tipo de documento:</label>
        <select formControlName="tipo" class="w-full px-4 py-2 rounded-full border bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="" disabled selected>Seleccione un tipo</option>
          <option value="dni">DNI</option>
          <option value="pasaporte">Pasaporte</option>
        </select>
      </div>
  
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Subtipo:</label>
        <select formControlName="subtipo" class="w-full px-4 py-2 rounded-full border bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="" disabled selected>Seleccione un subtipo</option>
          <option value="nacional">Nacional</option>
          <option value="extranjero">Extranjero</option>
        </select>
      </div>
  
      <div>
        <label class="block font-semibold text-gray-700 mb-1">Imagen:</label>
        <input type="file" class="w-full px-4 py-2 rounded-full border bg-white" />
      </div>
  
      <div class="flex justify-between pt-4">
        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-full">
          Guardar
        </button>
        <button type="button" class="bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-2 rounded-full" routerLink="/dashboard/process">
          Cancelar
        </button>
      </div>
  
      <!-- Botón Regresar -->
      <div class="flex justify-end pt-6">
        <button
          type="button"
          routerLink="/dashboard/process"
          class="flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-full shadow"
        >
          <i class="fa-solid fa-arrow-left"></i>
          <span>Regresar</span>
        </button>
      </div>
    </form>
  </section>

<section class="p-6">
    <h2 class="text-2xl font-bold text-blue-900 mb-6 text-center uppercase">
      Trámites
    </h2>
  
    <div class="grid gap-6 lg:grid-cols-2">
      <!-- Nuevo tipo -->
      <div class="bg-gray-100 rounded-2xl shadow p-6">
        <h3 class="text-lg font-bold text-gray-800 mb-4 text-center uppercase">Agregar nuevo tipo</h3>
        
        <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">
          Nombre:
        </label>
        <input
          id="tipo"
          type="text"
          class="w-full px-4 py-2 mb-4 rounded-md border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="Escribe el nombre del tipo"
        />
  
        <div class="flex justify-between mt-4">
          <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full font-semibold">
            Guardar
          </button>
          <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full font-semibold">
            Cancelar
          </button>
        </div>
      </div>
  
      <!-- Nuevo subtipo -->
      <div class="bg-gray-100 rounded-2xl shadow p-6">
        <h3 class="text-lg font-bold text-gray-800 mb-4 text-center uppercase">Agregar nuevo subtipo</h3>
        
        <label class="block text-sm font-medium text-gray-700 mb-1" for="subtipo">
          Nombre:
        </label>
        <input
          id="subtipo"
          type="text"
          class="w-full px-4 py-2 mb-4 rounded-md border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="Escribe el nombre del subtipo"
        />
  
        <div class="flex justify-between mt-4">
          <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full font-semibold">
            Guardar
          </button>
          <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full font-semibold">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  
    <!-- Botón regresar -->
    <div class="fixed bottom-6 right-6">
        <button [routerLink]="['/dashboard/home']"
          class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-full shadow-md flex items-center gap-2">
          <i class="fa-solid fa-rotate-left"></i> Regresar
        </button>
      </div>
  </section>
